name: Testes de API

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 3000
      BASE_URL: http://localhost:3000
      MONGODB_URI: mongodb://localhost:27017/gestao-de-alunos-test
      JWT_SECRET: segredo-somente-para-testes
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123
      ALUNO_EMAIL: junior.alcala@example.com
      ALUNO_SENHA: "123456"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Popular banco (seed)
        run: npm run seed

      - name: Iniciar a API em segundo plano
        run: |
          npm start &
          npx wait-on tcp:3000 --timeout 30000

      - name: Executar testes
        run: npm test